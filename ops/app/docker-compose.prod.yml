name: staza-prod

services:
  app:
    image: ${STAZA_IMAGE:?Set STAZA_IMAGE in the environment file}:${STAZA_IMAGE_TAG:?Set STAZA_IMAGE_TAG in the environment file}
    container_name: staza-prod-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /data/jobs
      MEDIA_DIR: /data/media
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the environment file}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?Set WEBAUTHN_RP_ID in the environment file}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:?Set WEBAUTHN_RP_NAME in the environment file}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:?Set WEBAUTHN_ORIGIN in the environment file}
    volumes:
      - app-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      internal: {}
      proxy:
        aliases:
          - staza-prod-app

  postgres:
    image: postgres:16-alpine
    container_name: staza-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the environment file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the environment file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

networks:
  internal:
    name: staza-prod-internal
    internal: true
  proxy:
    external: true
    name: staza-proxy

volumes:
  postgres-data:
    name: staza-prod-postgres-data
  app-data:
    name: staza-prod-app-data
