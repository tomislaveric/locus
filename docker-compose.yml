services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: post_ride_ar
      POSTGRES_USER: post_ride_ar
      POSTGRES_PASSWORD: post_ride_ar
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
