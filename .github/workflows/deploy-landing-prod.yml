name: Deploy landing (PROD)

# Deploys only the public Staza landing page to the shared PROD host over SSH
# for published releases tagged `staza-MAJOR.MINOR.PATCH` whose commit is
# reachable from main. It renders the English and German pages with a
# dependency-free static export and syncs the staged artifact. No application,
# VPS, database, or backend service is deployed.

on:
  release:
    types: [published]

concurrency:
  group: landing-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: landing-prod
      url: ${{ vars.LANDING_PUBLIC_URL }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      LANDING_SSH_HOST: ${{ secrets.LANDING_SSH_HOST }}
      LANDING_SSH_USER: ${{ secrets.LANDING_SSH_USER }}
      LANDING_SSH_PRIVATE_KEY: ${{ secrets.LANDING_SSH_PRIVATE_KEY }}
      LANDING_REMOTE_PATH: ${{ vars.LANDING_REMOTE_PATH }}
      LANDING_SSH_PORT: ${{ vars.LANDING_SSH_PORT }}
    steps:
      - name: Validate release tag
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^staza-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '${RELEASE_TAG}' does not match staza-MAJOR.MINOR.PATCH" >&2
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify tag commit is reachable from main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          TAG_COMMIT="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "${TAG_COMMIT}" origin/main; then
            echo "::error::Release commit ${TAG_COMMIT} is not reachable from origin/main" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Export landing artifact
        id: export
        run: |
          set -euo pipefail
          STAGING="$(node scripts/export-landing.mjs | tail -n 1)"
          echo "staging=${STAGING}" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        env:
          STAGING_DIR: ${{ steps.export.outputs.staging }}
        run: ./scripts/deploy-landing.sh
