name: Deploy landing

# Pushes to relevant main paths deploy to DEV. Manual runs can choose DEV or
# PROD; both always check out main and use the selected environment's secrets,
# variables, URL, and remote path.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment environment
        required: true
        type: choice
        default: dev
        options:
          - dev
          - prod

concurrency:
  group: landing-${{ inputs.target || 'dev' }}
  cancel-in-progress: ${{ inputs.target != 'prod' }}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: landing-${{ inputs.target || 'dev' }}
      url: ${{ vars.LANDING_PUBLIC_URL }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Export landing artifact
        id: export
        run: |
          set -euo pipefail
          STAGING="$(node scripts/export-landing.mjs | tail -n 1)"
          echo "staging=${STAGING}" >> "$GITHUB_OUTPUT"

      - name: Verify Apache configuration
        env:
          STAGING_DIR: ${{ steps.export.outputs.staging }}
        run: |
          set -euo pipefail
          test -f "$STAGING_DIR/.htaccess"
          test -r "$STAGING_DIR/.htaccess"

      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Deploy over SSH
        env:
          STAGING_DIR: ${{ steps.export.outputs.staging }}
          LANDING_SSH_HOST: ${{ secrets.LANDING_SSH_HOST }}
          LANDING_SSH_USER: ${{ secrets.LANDING_SSH_USER }}
          LANDING_SSH_PASSWORD: ${{ secrets.LANDING_SSH_PASSWORD }}
          LANDING_REMOTE_PATH: ${{ vars.LANDING_REMOTE_PATH }}
          LANDING_SSH_PORT: ${{ vars.LANDING_SSH_PORT }}
        run: ./scripts/deploy-landing.sh
