<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Post-ride AR POC</title>
    <style>
      body { background: #10131a; color: #f5f7fa; font: 16px system-ui, sans-serif; margin: 0; }
      main { max-width: 620px; margin: 8vh auto; padding: 2rem; background: #1b2130; border-radius: 12px; }
      h1 { margin-top: 0; } label { display: block; margin: 1rem 0; } input { display: block; margin-top: .4rem; }
      button { background: #ffd83d; border: 0; border-radius: 5px; color: #171717; cursor: pointer; font-weight: 700; padding: .7rem 1rem; }
      button:disabled { cursor: wait; opacity: .65; }
      #status { min-height: 1.5rem; margin-top: 1rem; } #passages, #activity-result { margin-top: 1rem; }
      #passages label { border: 1px solid #43506b; border-radius: 5px; padding: .6rem; }
      #passages input { display: inline; margin: 0 .5rem 0 0; } a { color: #ffd83d; }
      #replay { background: #0a0d13; border: 1px solid #43506b; border-radius: 5px; display: block; max-width: 100%; }
      #replay-controls { display: flex; gap: .5rem; margin-top: .5rem; } #activity-feed { padding-left: 1.25rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Post-ride activity</h1>
      <p>Upload a FIT activity to replay collected Coins, optionally with a matching GPS5 GoPro MP4 to create a highlight video.</p>
      <form id="upload">
        <label>FIT file <input name="fit" type="file" accept=".fit" required></label>
        <label>GoPro MP4 (optional) <input name="video" type="file" accept="video/mp4,.mp4"></label>
        <button>Process ride</button>
      </form>
      <p id="status" role="status"></p>
      <form id="passages" hidden>
        <fieldset>
          <legend>Detected Coin passages</legend>
          <div id="passage-list"></div>
        </fieldset>
        <button type="submit">Generate selected clips</button>
      </form>
      <section id="activity-result" hidden>
        <h2>Completed ride</h2>
        <p id="activity-stats"></p>
        <canvas id="replay" width="560" height="320" aria-label="Animated route replay"></canvas>
        <div id="replay-controls">
          <button id="replay-play" type="button">Play</button>
          <button id="replay-pause" type="button">Pause</button>
          <button id="replay-restart" type="button">Restart</button>
        </div>
        <ul id="activity-feed"></ul>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
